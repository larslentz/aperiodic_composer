kind = "web"
previewPath = "/"
title = "Lars Lentz's Aperiodic Composer"
version = "1.0.0"
id = "artifacts/penrose-music-generator"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22642

[services.development]
run = "pnpm --filter @workspace/penrose-music-generator run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/penrose-music-generator", "run", "build" ]
publicDir = "artifacts/penrose-music-generator/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22642"
BASE_PATH = "/"
